[package]
name = "modellbahn"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-stm32 = {version = "0.2.0", features =  ["defmt", "time-driver-any", "stm32f446ze", "memory-x", "unstable-pac", "exti", "chrono"]}
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures = { version = "0.1.0" }

defmt = "0.3.5"
defmt-rtt = "0.4.0"
cortex-m = {version = "0.7.7", features = ["critical-section-single-core"]}
cortex-m-rt = "0.7.3"
panic-probe = "0.3.1"

[profile.release]
debug = 2